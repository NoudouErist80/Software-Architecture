global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'vibe-platform'
    environment: 'local'

# No alert rules for local dev — alertmanager not running
alerting:
  alertmanagers: []

rule_files: []

scrape_configs:

  - job_name: 'vibe-api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['vibe-api-gateway:8090']
        labels:
          service: 'api-gateway'

  - job_name: 'vibe-auth-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['vibe-auth-service:8081']
        labels:
          service: 'auth-service'

  - job_name: 'vibe-messaging-service'
