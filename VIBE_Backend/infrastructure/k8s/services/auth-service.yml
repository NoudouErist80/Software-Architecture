apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibe-auth-service
  namespace: vibe
  labels:
    app: vibe-auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vibe-auth-service
  template:
    metadata:
      labels:
        app: vibe-auth-service
    spec:
      containers:
        - name: auth-service
          image: vibe/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: vibe-config
            - secretRef:
                name: vibe-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: vibe-auth-service
  namespace: vibe
spec:
  selector:
    app: vibe-auth-service
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vibe-auth-hpa
  namespace: vibe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vibe-auth-service
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
