apiVersion: v1
kind: ConfigMap
metadata:
  name: vibe-config
  namespace: vibe
data:
  REDIS_HOST: "vibe-redis"
  REDIS_PORT: "6379"
  KAFKA_SERVERS: "vibe-kafka:9092"
  KAFKA_ENABLED: "true"
  MONGO_HOST: "vibe-mongodb"
  MONGO_PORT: "27017"
  POSTGRES_AUTH_HOST: "vibe-postgres-auth"
  POSTGRES_REWARDS_HOST: "vibe-postgres-rewards"
  POSTGRES_REWARDS_PORT: "5432"
  CORS_ORIGINS: "http://localhost:3000"
