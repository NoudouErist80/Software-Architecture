# ══════════════════════════════════════════════════════════════════════════════
# LOCAL DEVELOPMENT PROFILE — auth-service
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# Redis and Kafka are OPTIONAL in local dev:
#   • Redis down  → TokenCacheService falls back to in-memory map (see logs)
#   • Kafka down  → VibeEventPublisher circuit-breaker drops events gracefully
# Registration and login work without either service running.
# ══════════════════════════════════════════════════════════════════════════════
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vibe_auth
    username: vibe
    password: vibe_local_2026

  data:
    redis:
      host: localhost
      port: 6379
      password: vibe_redis
      timeout: 500ms          # short timeout so startup is not blocked
      connect-timeout: 500ms
      lettuce:
        pool:
          max-active: 5
          max-idle: 2
          min-idle: 0
          max-wait: 200ms

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 1000    # fail fast so startup is not blocked

# Disable Kafka events in local dev (circuit-breaker handles it even if true,
# but setting false avoids Kafka connection attempts entirely)
vibe:
  kafka:
    enabled: false

# Disable Redis health check so /actuator/health stays UP without Redis
management:
  health:
    redis:
      enabled: false

logging:
  level:
    root: WARN
    com.vibe: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    io.lettuce: WARN
    org.apache.kafka: WARN
    org.springframework.data.redis: WARN