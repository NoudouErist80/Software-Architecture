# ══════════════════════════════════════════════════════════════
# LOCAL DEVELOPMENT PROFILE for API Gateway
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ══════════════════════════════════════════════════════════════
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: vibe_redis
      # In local dev Redis may not be running — do not block gateway startup
      lettuce:
        pool:
          max-active: 5
          max-idle: 2
          min-idle: 0
          max-wait: 200ms

  # Disable Redis health indicator so gateway health endpoint stays UP
  # when Redis is not running locally
management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.vibe: DEBUG
    org.springframework.cloud.gateway: INFO
    io.lettuce: WARN
    org.springframework.data.redis: WARN