server:
  port: ${SERVER_PORT:8082}
  tomcat:
    threads:
      max: 300
      min-spare: 30

spring:
  application:
    name: vibe-messaging-service

  data:
    mongodb:
      uri: mongodb://vibe:vibe_local_2026@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/vibe_messaging?authSource=admin
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:vibe_redis}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_ENABLED:true}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        delivery.timeout.ms: 8000
        request.timeout.ms: 3000
        max.block.ms: 3000
    consumer:
      group-id: vibe-messaging-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.vibe.*,java.util,java.lang"

vibe:
  jwt:
    secret: ${JWT_SECRET:ViBe_Super_Secret_2026_Africa_TchangoNoudouJoseph}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8087}
    api-key: ${CLAUDE_API_KEY:}
    api-url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-20250514
  messaging:
    max-group-members: 500
    message-max-length: 4000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.vibe: INFO
