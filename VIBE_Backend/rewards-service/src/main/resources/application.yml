server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: vibe-rewards-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_REWARDS_HOST:localhost}:${POSTGRES_REWARDS_PORT:5433}/vibe_rewards
    username: vibe
    password: vibe_local_2026
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:vibe_redis}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_ENABLED:true}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        delivery.timeout.ms: 8000
        request.timeout.ms: 3000
        max.block.ms: 3000
    consumer:
      group-id: vibe-rewards-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Values are read as raw JSON strings and converted to each @KafkaListener's
      # parameter type by the StringJsonMessageConverter bean (see KafkaConsumerConfig).
      # The producers send JSON WITHOUT type headers (spring.json.add.type.headers=false),
      # so a plain JsonDeserializer cannot infer the target type — this approach does,
      # per-listener, and a StringDeserializer never fails on a malformed record.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

vibe:
  jwt:
    secret: ${JWT_SECRET:ViBe_Super_Secret_2026_Africa_TchangoNoudouJoseph}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.vibe: INFO
